<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Shells Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: sticky header with tabs; each view is a column of sections.
   Stage views = animated network scene on top, guide card + two terminals below. */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --surface2: #e8edf4; --ink: #121c2a; --muted: #536274; --line: #cdd6e2;
  --kali: #b8174f; --kali-soft: #fae1ea; --on-kali: #ffffff;
  --win: #1560b8; --win-soft: #dbe9f9; --on-win: #ffffff;
  --fw: #a35f00; --fw-soft: #fcefd2;
  --ok: #17753f; --ok-soft: #dcf2e5; --bad: #bd2424; --bad-soft: #fbe0e0;
  --term-bg: #0e1620; --term-fg: #d3e0ee; --t-dim: #7d90a6; --t-prompt: #6fb0ff; --t-ok: #5fd89a; --t-err: #ff8a8a; --t-log: #f0c060;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111a; --surface: #131c28; --surface2: #1b2736; --ink: #e5edf6; --muted: #94a5b9; --line: #273649;
    --kali: #ff7aa6; --kali-soft: #3a1727; --on-kali: #240a14;
    --win: #62aeff; --win-soft: #11294a; --on-win: #08203d;
    --fw: #f2b650; --fw-soft: #392a0d;
    --ok: #4fd68c; --ok-soft: #12301f; --bad: #ff8080; --bad-soft: #3b1717;
    --term-bg: #070b11; --term-fg: #cfe0f2; --t-dim: #71859c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111a; --surface: #131c28; --surface2: #1b2736; --ink: #e5edf6; --muted: #94a5b9; --line: #273649;
  --kali: #ff7aa6; --kali-soft: #3a1727; --on-kali: #240a14;
  --win: #62aeff; --win-soft: #11294a; --on-win: #08203d;
  --fw: #f2b650; --fw-soft: #392a0d;
  --ok: #4fd68c; --ok-soft: #12301f; --bad: #ff8080; --bad-soft: #3b1717;
  --term-bg: #070b11; --term-fg: #cfe0f2; --t-dim: #71859c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--win); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4.4vw, 44px); font-weight: 700; }
h2 { font-size: clamp(21px, 2.6vw, 28px); font-weight: 650; }
h3 { font-size: 18px; font-weight: 650; }
h4 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-family: var(--f-body); }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .92em; }
.mono { font-family: var(--f-mono); }
code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
a { color: var(--win); }

.app { max-width: 1220px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .inner { padding-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 12px; display: block; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 360px; min-width: 0; scrollbar-width: thin; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--win); }
.tab[data-k="bind"][aria-selected="true"], .tab[data-k="reverse"][aria-selected="true"], .tab[data-k="web"][aria-selected="true"] { border-bottom-color: var(--kali); }
.tools { padding-bottom: 8px; display: flex; gap: 8px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--win); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--win); color: var(--on-win); border-color: var(--win); }
.btn.kali { background: var(--kali); color: var(--on-kali); border-color: var(--kali); }
.btn.small { padding: 3px 9px; font-size: 13px; }

main { padding-block: 22px 40px; display: flex; flex-direction: column; gap: 28px; }
.view { display: flex; flex-direction: column; gap: 22px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.lead { font-size: 17px; color: var(--muted); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.callout { border-radius: var(--r); padding: 12px 14px; border: 1px solid var(--line); background: var(--surface2); }
.callout.def { background: var(--fw-soft); border-color: var(--fw); }
.callout.def h4, .callout.def b.t { color: var(--fw); }
.callout.warn { background: var(--bad-soft); border-color: var(--bad); }
.callout.ok { background: var(--ok-soft); border-color: var(--ok); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid2, .grid3, .grid4 { grid-template-columns: minmax(0, 1fr); } }
.pill { display: inline-block; font-size: 12px; font-weight: 650; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; letter-spacing: .03em; }
.pill.k { color: var(--kali); } .pill.w { color: var(--win); } .pill.f { color: var(--fw); } .pill.o { color: var(--ok); } .pill.b { color: var(--bad); }

/* path cards */
.path a.card { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--win); }
.path a.card:hover { border-color: var(--kali); }
.path .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* scene */
.scene-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.scene { display: block; width: 100%; min-width: 760px; height: auto; }
.scene text { fill: var(--ink); font-family: var(--f-body); }
.scene .mono { font-family: var(--f-mono); }
.scene .muted { fill: var(--muted); }
.zone-net { fill: var(--surface2); opacity: .55; }
.zone-lan { fill: var(--win-soft); opacity: .6; }
.node { fill: var(--surface); stroke-width: 2.5; transition: stroke-width .2s, filter .2s; }
.node.k { stroke: var(--kali); } .node.w { stroke: var(--win); }
.node.hl { stroke-width: 5; }
.row rect { fill: var(--surface2); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s, fill .2s; }
.row.pulse rect { stroke: var(--win); stroke-width: 4; fill: var(--win-soft); }
.row { transition: opacity .35s; }
.row.off { opacity: 0; pointer-events: none; }
.wall { fill: var(--fw-soft); stroke: var(--fw); stroke-width: 2.5; }
.wall.hl { stroke-width: 5; }
.brick { stroke: var(--fw); stroke-width: 1; opacity: .5; }
.sock { fill: var(--surface); stroke-width: 3; transition: opacity .3s; }
.sock.k { stroke: var(--kali); } .sock.w { stroke: var(--win); }
.sock.off { opacity: 0; }
.chip { transition: opacity .3s; }
.chip.off { opacity: 0; }
.scene .chip.listen, .scene .chip.on { fill: var(--ok); } .scene .chip.syn { fill: var(--fw); } .scene .chip.bad { fill: var(--bad); }
.link { stroke-width: 3; fill: none; transition: opacity .3s; }
.link.off { opacity: 0; }
.link.shell { stroke: var(--ok); } .link.http { stroke: var(--win); stroke-dasharray: 8 6; }
.scene .linklabel { font-size: 13px; font-weight: 600; fill: var(--ok); transition: opacity .3s; }
.linklabel.off { opacity: 0; }
.pk rect { stroke: none; }
.pk.k rect { fill: var(--kali); } .pk.w rect { fill: var(--win); }
.pk text { font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.pk.k text { fill: var(--on-kali); } .pk.w text { fill: var(--on-win); }
.xmark { fill: none; stroke: var(--bad); stroke-width: 5; stroke-linecap: round; }
.xmark.off, .stateTag.off, .pipe.off { opacity: 0; }
.pipe { transition: opacity .3s; }
.pipe text { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.pipe path { stroke: var(--muted); stroke-width: 2; fill: none; }
.stateTag text { font-family: var(--f-mono); font-size: 12px; fill: var(--fw); font-weight: 600; }
.pickable { cursor: pointer; }
.pickable:hover .node, .pickable:hover .wall { stroke-width: 5; }

/* fw rules */
.rules { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; font-family: var(--f-mono); font-size: 12.5px; }
.rules .r { padding: 3px 8px; border-radius: 5px; background: var(--surface2); border: 1px solid transparent; display: flex; gap: 10px; flex-wrap: wrap; }
.rules .r.hit { border-color: var(--fw); background: var(--fw-soft); }
.rules .r.deny b { color: var(--bad); } .rules .r.allow b { color: var(--ok); }
.rules .st { color: var(--muted); }

/* controls */
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.stp { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 5px; font-size: 13px; font-weight: 550; color: var(--muted); }
.stp i { font-style: normal; font-family: var(--f-mono); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); font-size: 12px; }
.stp.done i { background: var(--ok); color: var(--surface); }
.stp.cur { color: var(--ink); border-color: var(--kali); }
.stp.cur i { background: var(--kali); color: var(--on-kali); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 5px 11px; font-size: 13px; font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--win); color: var(--on-win); }

.stage { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.guide { display: flex; flex-direction: column; gap: 12px; }
.guide .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.guide .hd .num { font-family: var(--f-mono); color: var(--kali); font-weight: 600; }
.guide p + p { margin-top: 8px; }
.cmdblock { background: var(--term-bg); color: var(--term-fg); border-radius: 8px; padding: 10px 12px; font-family: var(--f-mono); font-size: 13px; overflow-x: auto; }
.cmdblock .who { display: inline-block; font-size: 11px; font-weight: 650; padding: 0 7px; border-radius: 4px; margin-bottom: 4px; letter-spacing: .04em; }
.who.k { background: var(--kali); color: var(--on-kali); } .who.w { background: var(--win); color: var(--on-win); } .who.ps { background: var(--fw); color: var(--surface); } .who.http { background: var(--ok); color: var(--surface); }
.cmdblock pre { margin: 0; white-space: pre; }
.tok { background: none; border: 0; border-bottom: 1px dotted var(--t-prompt); color: var(--term-fg); font: inherit; padding: 0 1px; cursor: help; }
.tok:hover, .tok[aria-pressed="true"] { background: rgba(111,176,255,.25); }
.tokinfo { margin-top: 6px; font-family: var(--f-body); font-size: 13px; color: var(--t-log); min-height: 1.4em; white-space: normal; }
details.why { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface2); }
details.why summary { cursor: pointer; font-weight: 600; }
details.why[open] summary { margin-bottom: 6px; }
.predict { border: 2px dashed var(--kali); border-radius: var(--r); padding: 12px 14px; background: var(--kali-soft); }
.predict .q { font-weight: 650; margin: 4px 0 8px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; }
.opt:hover:not(:disabled) { border-color: var(--kali); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.predict .fb { margin-top: 8px; }
ul.pts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.tasks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.tasks li { display: flex; gap: 8px; align-items: flex-start; }
.tasks .chk { flex: 0 0 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; margin-top: 2px; }
.tasks li.done .chk { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tasks button.try { background: var(--surface2); border: 1px solid var(--line); border-radius: 5px; font-family: var(--f-mono); font-size: 12.5px; padding: 0 6px; }
.tasks button.try:hover { border-color: var(--win); }

/* terminals */
.terms { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.term { background: var(--term-bg); color: var(--term-fg); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); min-width: 0; }
.term .th { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid #ffffff22; }
.term .th.k { background: var(--kali); color: var(--on-kali); } .term .th.w { background: var(--win); color: var(--on-win); }
.term .tb { height: 250px; overflow: auto; padding: 8px 12px; font-family: var(--f-mono); font-size: 12px; line-height: 1.45; white-space: pre; }
.term .ln.log, .term .ln.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.term .ln.pr { color: var(--t-prompt); }
.term .ln .c { color: #fff; }
.term .ln.dim { color: var(--t-dim); font-style: italic; }
.term .ln.err { color: var(--t-err); }
.term .ln.log .tag { color: var(--t-log); font-weight: 600; }
.term .caret::after { content: "▌"; animation: blink 1s steps(2) infinite; color: var(--t-prompt); }
@keyframes blink { 50% { opacity: 0; } }
.term form { display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px; border-top: 1px solid #ffffff22; font-family: var(--f-mono); font-size: 13px; }
.term form .pl { color: var(--t-prompt); white-space: nowrap; }
.term form input { flex: 1; min-width: 0; background: #ffffff10; border: 1px solid #ffffff30; border-radius: 5px; color: #fff; padding: 4px 8px; font-family: var(--f-mono); font-size: 13px; }
.term .tf { display: flex; gap: 6px; padding: 6px 12px; border-top: 1px solid #ffffff22; flex-wrap: wrap; }

/* lab */
.lab { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.fieldset legend, .fieldset .lg { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.fld { display: flex; flex-direction: column; gap: 4px; padding-left: 8px; border-left: 3px solid transparent; }
.fld.used { border-left-color: var(--ok); }
.fld.unused { opacity: .55; }
.fld label.l { font-weight: 600; font-size: 13.5px; }
.fld .hint { font-size: 12.5px; color: var(--muted); }
.fld select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.sw { display: flex; gap: 8px; align-items: center; }
.sw input { width: 18px; height: 18px; accent-color: var(--win); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: flex; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); }
.checks li .ic { flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.checks li.pass .ic { background: var(--ok); color: var(--surface); }
.checks li.fail { border-color: var(--bad); background: var(--bad-soft); }
.checks li.fail .ic { background: var(--bad); color: var(--surface); }
.checks li.skip { opacity: .5; }
.verdict { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }

/* compare / quiz / glossary */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.cmp { border-collapse: collapse; width: 100%; min-width: 760px; background: var(--surface); font-size: 14px; }
table.cmp th, table.cmp td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cmp thead th { background: var(--surface2); position: sticky; top: 0; font-family: var(--f-display); font-size: 15px; }
table.cmp tbody th { width: 17%; color: var(--muted); font-weight: 600; font-size: 13px; }
table.cmp tbody tr:hover td, table.cmp tbody tr:hover th { background: var(--surface2); }
.quiz { display: flex; flex-direction: column; gap: 14px; }
.qcard { display: flex; flex-direction: column; gap: 8px; }
.gloss { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .gloss { grid-template-columns: minmax(0, 1fr); } }
.gloss dt { font-weight: 650; font-family: var(--f-display); }
.gloss dd { margin: 2px 0 0; color: var(--muted); }
.gloss > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.glossq { width: 100%; max-width: 420px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; }

/* intro figures */
.fig { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.fig svg { display: block; min-width: 720px; width: 100%; max-width: 940px; margin: 0 auto; height: auto; }
.fig svg text { fill: var(--ink); font-family: var(--f-body); }
.fig .nbox { fill: var(--surface2); stroke: var(--line); stroke-width: 2; }
.fig .nbox.k { stroke: var(--kali); } .fig .nbox.w { stroke: var(--win); }
.fig .arrow { stroke: var(--muted); stroke-width: 2.5; fill: none; }
.fig .dot { fill: var(--fw); stroke: var(--surface); stroke-width: 2; }
.fig .lbl { font-family: var(--f-mono); font-size: 13px; fill: var(--muted); }
.cap { font-size: 13.5px; color: var(--muted); min-height: 2.7em; }
.mini { display: flex; gap: 8px; flex-wrap: wrap; }
.verdict-box { min-height: 5.5em; }
.fine { font-size: 13px; color: var(--muted); }
.scroll-hint { display: none; }
@media (max-width: 800px) { .scroll-hint { display: block; } }
footer.foot { border-top: 1px solid var(--line); padding-block: 18px 30px; color: var(--muted); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* hunt exercise + misc */
.stp span { max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hunt { display: flex; flex-direction: column; gap: 6px; }
.hrow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: 12.5px; cursor: pointer; word-break: break-word; }
.hrow input { margin-top: 3px; accent-color: var(--kali); flex: none; }
.hrow .tag { color: var(--t-log); font-weight: 600; }
.hrow .why { display: block; font-family: var(--f-body); font-size: 13px; margin-top: 4px; color: var(--term-fg); }
.hrow.good { border-color: var(--ok); } .hrow.miss { border-color: var(--bad); } .hrow.fp { border-color: var(--fw); }

.scorebar { font-size: 13px; color: var(--muted); }

<script>
/* ============ Content: the three guided stages ============
   All names, IPs and logs are fictional. 203.0.113.0/24 and 198.51.100.0/24 are RFC 5737 documentation ranges. */
const T = (es, en) => ({ es, en });
const IP_K = '203.0.113.50', IP_FW = '198.51.100.10', IP_W = '10.0.0.20';
const CWD0 = 'C:\\Windows\\System32\\inetsrv';
const ID_POOL = 'IIS APPPOOL\\DefaultAppPool';
const kc = (s) => ({ t: 'kc', s });
const o = (s) => ({ t: 'o', s });
const rp = (p, c) => ({ t: 'rp', p, c });
const lg = (tag, s) => ({ t: 'lg', tag, s });
const wc = (s) => ({ t: 'wc', s });
const ns = (mode, filter) => ({ t: 'ns', mode, filter });
const BANNER = [o('Microsoft Windows [Version 10.0.20348.2113]'), o('(c) Microsoft Corporation. All rights reserved.'), o('')];

const NCV = 'nc -nv 198.51.100.10 4444';
const NCV_TOK = [
  ['nc', T('Netcat: abre una conexión TCP y conecta tu teclado y tu pantalla a ella.', 'Netcat: opens a TCP connection and wires your keyboard and screen to it.')],
  ['-nv', T('-n: no resolver nombres (usa la IP tal cual). -v: verboso, informa si la conexión se abre, se rechaza o expira.', '-n: skip name resolution (use the IP as given). -v: verbose, reports whether the connection opened, was refused or timed out.')],
  ['198.51.100.10', T('IP pública del servidor: la del firewall, que la traduce a 10.0.0.20.', 'The server’s public IP: the firewall’s, which translates it to 10.0.0.20.')],
  ['4444', T('Puerto TCP donde escucha el payload.', 'TCP port where the payload is listening.')],
];
const EXPLOIT_PKT = { pk: 'k>w', lane: 'http', label: 'HTTPS · exploit' };
const PIPE_PSEUDO = T(
  'CreateProcess("cmd.exe",\n   stdin  = c,     # lo que llega por el socket entra como si fuera teclado\n   stdout = c,     # lo que cmd.exe escribe sale por el socket\n   stderr = c)     # los errores también',
  'CreateProcess("cmd.exe",\n   stdin  = c,     # whatever arrives on the socket enters as if typed\n   stdout = c,     # whatever cmd.exe prints leaves through the socket\n   stderr = c)     # so do the errors'
);
const ROW_A = { t1: 'IIS · w3wp.exe', t2: ID_POOL };
const ROW_PAYLOAD = { t1: 'payload.exe', t2: T('hijo de w3wp · misma identidad', 'child of w3wp · same identity') };
const ROW_CMD = { t1: 'cmd.exe', t2: 'stdin/stdout ⇄ socket' };

const LIVE_TASKS_SHELL = (kind) => [
  { cmd: 'whoami', q: T('¿Con qué identidad corre la shell? ¿Es administrador?', 'Which identity does the shell run as? Is it an administrator?') },
  { cmd: 'ipconfig', q: T('¿Qué IP ve el propio servidor? Compárala con la IP pública a la que conectó Kali.', 'Which IP does the server itself see? Compare it with the public IP Kali connected to.') },
  { cmd: 'cd C:\\inetpub\\wwwroot', q: T('¿Cambia el prompt? La shell recuerda el directorio porque es un único proceso cmd.exe.', 'Does the prompt change? The shell remembers the directory because it is a single cmd.exe process.') },
  { cmd: 'dir', q: T('Explora la raíz web del portal. ¿Qué carpeta recibe las subidas de los usuarios?', 'Browse the portal’s web root. Which folder receives user uploads?') },
  { cmd: 'netstat -ano', q: kind === 'bind'
      ? T('Localiza tu propia conexión: puerto local 4444 (el del payload), remoto = tu Kali.', 'Find your own connection: local port 4444 (the payload’s), remote = your Kali.')
      : T('Localiza tu propia conexión: es SALIENTE; el puerto local es efímero y el remoto es el 4444 de Kali.', 'Find your own connection: it is OUTBOUND; the local port is ephemeral and the remote is Kali’s 4444.') },
  { cmd: 'exit', q: T('Cierra la sesión: cmd.exe termina, el payload cierra el socket y el listener o el cliente de Kali vuelve al prompt local.', 'End the session: cmd.exe exits, the payload closes the socket and Kali’s listener/client returns to the local prompt.') },
];

const STAGES = {};

/* ---------------------------------------------------------------- BIND */
STAGES.bind = {
  name: T('Bind shell', 'Bind shell'),
  goal: T('El servidor escucha en un puerto y el atacante se conecta a él.', 'The server listens on a port and the attacker connects to it.'),
  steps: [
    {
      title: T('Punto de partida: ya hay ejecución de código', 'Starting point: code execution already exists'),
      what: T('Una shell no es una vulnerabilidad: es el <b>canal</b> que construyes <i>después</i> de lograr ejecución de código. Aquí asumimos que el portal de ACME (IIS en Windows Server 2022) tiene una falla que permite al atacante ejecutar un programa en el servidor. El firewall perimetral sólo deja entrar tráfico web (80 y 443), así que el exploit viaja dentro de una petición HTTPS normal.',
        'A shell is not a vulnerability: it is the <b>channel</b> you build <i>after</i> you get code execution. Here we assume ACME’s portal (IIS on Windows Server 2022) has a flaw that lets the attacker run a program on the server. The perimeter firewall only lets web traffic in (80 and 443), so the exploit rides inside an ordinary HTTPS request.'),
      predict: {
        q: T('¿Por qué el exploit atraviesa un firewall que sólo permite 80 y 443?', 'Why does the exploit get through a firewall that only allows 80 and 443?'),
        opts: [T('El firewall está roto.', 'The firewall is broken.'), T('Viaja dentro de una petición a un puerto que sí está permitido (443).', 'It rides inside a request to a port that is allowed (443).'), T('Usa UDP, que los firewalls no filtran.', 'It uses UDP, which firewalls do not filter.')],
        ok: 1,
        why: T('El firewall decide por dirección, puerto y estado de la conexión, no por la intención de lo que va dentro. Un puerto permitido es un camino abierto para cualquier contenido, bueno o malo.', 'The firewall decides by address, port and connection state, not by the intent of what travels inside. An allowed port is an open road for any content, good or bad.'),
      },
      def: T('Hasta aquí es un POST a 443 como cualquier otro. Sólo un WAF o la telemetría del servidor (qué procesos lanza w3wp.exe) puede distinguirlo.', 'So far this is a POST to 443 like any other. Only a WAF or the server’s own telemetry (which processes w3wp.exe launches) can tell it apart.'),
      scene: { rows: { A: ROW_A }, fwHit: 'in80', hl: ['fw'] },
      anim: [EXPLOIT_PKT, { pulse: ['A'] }, { pk: 'w>k', lane: 'http', label: '200 OK' }],
      k: [],
      w: [lg('FW', 'ALLOW tcp 203.0.113.50:50412 → 198.51.100.10:443 · rule IN allow tcp 80,443'), lg('IIS', '2026-10-23 14:58:03 10.0.0.20 POST /portal/export - 443 - 203.0.113.50 Mozilla/5.0 - 200 0 0 212')],
    },
    {
      title: T('El payload abre un socket y se pone a escuchar', 'The payload opens a socket and starts listening'),
      what: T('w3wp.exe ejecuta el payload: un programa pequeño que pide cuatro cosas al sistema operativo (pseudocódigo abajo). Con <code>listen()</code> el servidor pasa a ser quien <b>espera</b>; nadie ha conectado todavía. El payload hereda la identidad del proceso que lo lanzó: la cuenta del pool de IIS, no un administrador.',
        'w3wp.exe runs the payload: a tiny program that asks the operating system for four things (pseudocode below). With <code>listen()</code> the server becomes the one that <b>waits</b>; nobody has connected yet. The payload inherits the identity of the process that launched it: the IIS app-pool account, not an administrator.'),
      cmd: [{ who: 'ps', text: T('s = socket(TCP)             # crea un extremo de comunicación\nbind(s, 0.0.0.0:4444)       # lo asocia al puerto 4444 de todas las interfaces\nlisten(s)                   # estado LISTEN: acepta conexiones entrantes\nc = accept(s)               # se bloquea hasta que alguien conecte',
        's = socket(TCP)             # creates a communication endpoint\nbind(s, 0.0.0.0:4444)       # attaches it to port 4444 on every interface\nlisten(s)                   # LISTEN state: accepts incoming connections\nc = accept(s)               # blocks until somebody connects') }],
      why: T('<code>0.0.0.0</code> significa “todas las interfaces IPv4 del host”. El puerto 4444 es sólo una convención (es el predeterminado de los handlers de Metasploit); cualquier puerto libre sirve. Escuchar no envía ni un paquete: el servidor se limita a dejar un socket abierto esperando un SYN.',
        '<code>0.0.0.0</code> means “every IPv4 interface on the host”. Port 4444 is only a convention (it is the default in Metasploit handlers); any free port works. Listening sends no packet at all: the server just leaves a socket open, waiting for a SYN.'),
      predict: {
        q: T('El servidor ya está en LISTEN. ¿Quién envía el primer paquete (SYN)?', 'The server is now in LISTEN. Who sends the first packet (SYN)?'),
        opts: [T('El atacante (cliente).', 'The attacker (client).'), T('El servidor, hacia el atacante.', 'The server, toward the attacker.'), T('Ambos a la vez.', 'Both at once.')],
        ok: 0,
        why: T('Un socket en LISTEN sólo responde. La conexión la inicia quien hace <code>connect()</code>: en una bind shell, el atacante.', 'A socket in LISTEN only answers. The connection is started by whoever calls <code>connect()</code>: in a bind shell, the attacker.'),
      },
      def: T('Un puerto nuevo en LISTEN abierto por un hijo de w3wp.exe es raro en un servidor web. Se ve con <code>netstat -ano</code>, con Sysmon (evento 3) o, si activas la auditoría de la plataforma de filtrado, con el evento 5154.', 'A new LISTEN port opened by a child of w3wp.exe is unusual on a web server. You can see it with <code>netstat -ano</code>, with Sysmon (event 3) or, if you enable Filtering Platform auditing, with event 5154.'),
      scene: { rows: { B: ROW_PAYLOAD }, wSock: true, chips: { w1: { t: 'LISTEN\n:4444', c: 'listen' } }, hl: ['w'] },
      anim: [{ pulse: ['A'] }, { pulse: ['B'] }],
      k: [],
      w: [lg('SYSMON', 'EID 1 · Image=C:\\Windows\\Temp\\payload.exe · ParentImage=C:\\Windows\\System32\\inetsrv\\w3wp.exe · User=IIS APPPOOL\\DefaultAppPool'), wc('netstat -ano | findstr :4444'), ns('bind-listen', ':4444')],
    },
    {
      title: T('Primer intento: el firewall lo descarta', 'First attempt: the firewall drops it'),
      what: T('Kali intenta conectar directamente a la IP pública del servidor, puerto 4444. Pero el firewall perimetral sólo publica 80 y 443: el SYN cae en la regla <i>deny</i> por defecto y se <b>descarta sin responder</b>. Kali reintenta y, al cabo de unos dos minutos, se rinde.',
        'Kali tries to connect straight to the server’s public IP, port 4444. But the perimeter firewall only publishes 80 and 443: the SYN falls into the default <i>deny</i> rule and is <b>dropped without a reply</b>. Kali retries and gives up after about two minutes.'),
      cmd: [{ who: 'k', text: NCV, tokens: NCV_TOK }],
      why: T('Un firewall que hace DROP no contesta: ni SYN-ACK ni RST. Kali sólo ve silencio y expira (<i>timed out</i>). “Refused” llegaría si el paquete alcanzara el host y no hubiera nadie escuchando: el host respondería RST. Es la diferencia entre un puerto <i>filtered</i> y uno <i>closed</i> en Nmap. Los mensajes son los de netcat-traditional, el <code>nc</code> predeterminado en Kali; ncat y OpenBSD nc los redactan distinto.',
        'A firewall that DROPs does not answer: no SYN-ACK, no RST. Kali only sees silence and times out. “Refused” would arrive if the packet reached the host and nobody was listening: the host would answer RST. It is the same difference as a <i>filtered</i> versus a <i>closed</i> port in Nmap. The messages shown are those of netcat-traditional, the default <code>nc</code> on Kali; ncat and OpenBSD nc word them differently.'),
      predict: {
        q: T('Kali muestra un mensaje. ¿Cuál?', 'Kali prints a message. Which one?'),
        opts: [T('Connection refused', 'Connection refused'), T('Connection timed out', 'Connection timed out'), T('Connection reset by peer', 'Connection reset by peer')],
        ok: 1,
        why: T('El DROP no genera respuesta alguna, así que el cliente espera y expira. Rechazo y reset implican que alguien contestó con un RST.', 'DROP produces no reply at all, so the client waits and times out. Refused and reset both imply that somebody answered with an RST.'),
      },
      def: T('El firewall registra el intento: tres SYN en segundos a un puerto no publicado. Es una alerta temprana barata, porque ningún usuario legítimo tiene motivo para llamar a ese puerto.', 'The firewall logs the attempt: three SYNs within seconds to an unpublished port. It is a cheap early warning, since no legitimate user has any reason to call that port.'),
      scene: { fwBlock: true, fwHit: 'in-deny', hl: ['fw'], chips: { k2: { t: 'timed out', c: 'bad' } } },
      anim: [{ pk: 'k>w', lane: 'shell', label: 'SYN', stop: 'fw' }, { wait: 450 }, { pk: 'k>w', lane: 'shell', label: 'SYN (retx)', stop: 'fw' }, { wait: 450 }, { pk: 'k>w', lane: 'shell', label: 'SYN (retx)', stop: 'fw' }],
      k: [kc(NCV), o('(UNKNOWN) [198.51.100.10] 4444 (?) : Connection timed out')],
      w: [lg('FW', 'DENY  tcp 203.0.113.50:51820 → 198.51.100.10:4444 · default deny inbound · x3 (SYN retransmissions)')],
    },
    {
      title: T('Con la entrada abierta: el saludo de tres vías', 'With the inbound open: the three-way handshake'),
      what: T('Imagina que alguien abrió TCP/4444 de entrada (una regla “temporal” que nadie retiró), o que el atacante está en la misma red y no hay firewall en medio. Ahora el SYN llega al socket en LISTEN, el servidor contesta SYN-ACK y Kali cierra con ACK. En ese instante <code>accept()</code> devuelve y existe una conexión TCP: un canal de bytes en ambos sentidos. Todavía <b>no hay shell</b>, sólo bytes.',
        'Imagine somebody opened inbound TCP/4444 (a “temporary” rule nobody removed), or that the attacker sits on the same network with no firewall in between. Now the SYN reaches the socket in LISTEN, the server answers SYN-ACK and Kali closes with ACK. At that instant <code>accept()</code> returns and a TCP connection exists: a byte channel in both directions. There is <b>still no shell</b>, only bytes.'),
      cmd: [{ who: 'k', text: NCV, tokens: NCV_TOK }],
      why: T('SYN: “quiero hablar; mi número de secuencia inicial es x”. SYN-ACK: “recibido; el mío es y y espero x+1”. ACK: “recibido; espero y+1”. Con esos tres mensajes ambos lados acuerdan números de secuencia, que es la base de la entrega fiable y ordenada de TCP.',
        'SYN: “I want to talk; my initial sequence number is x”. SYN-ACK: “received; mine is y and I expect x+1”. ACK: “received; I expect y+1”. With those three messages both sides agree on sequence numbers, which is the basis of TCP’s reliable, ordered delivery.'),
      def: T('Ahora hay evidencia fuerte: el firewall permite 4444 desde una IP desconocida, Sysmon (evento 3, <code>Initiated=false</code>) registra a payload.exe aceptando una conexión y netstat muestra ESTABLISHED.', 'Now there is strong evidence: the firewall allows 4444 from an unknown IP, Sysmon (event 3, <code>Initiated=false</code>) records payload.exe accepting a connection and netstat shows ESTABLISHED.'),
      scene: { openPort: 4444, fwBlock: false, fwHit: 'in4444', fwState: '203.0.113.50:51822 ⇄ 10.0.0.20:4444', conn: { lane: 'shell', label: 'TCP 4444' }, chips: { k2: { t: 'ESTABLISHED', c: 'on' }, w1: { t: 'ESTABLISHED\n:4444', c: 'on' } }, hl: ['fw'] },
      anim: [{ pk: 'k>w', lane: 'shell', label: 'SYN' }, { pk: 'w>k', lane: 'shell', label: 'SYN-ACK' }, { pk: 'k>w', lane: 'shell', label: 'ACK' }],
      k: [kc(NCV), o('(UNKNOWN) [198.51.100.10] 4444 (?) open')],
      w: [lg('FW', 'ALLOW tcp 203.0.113.50:51822 → 198.51.100.10:4444 · rule IN allow tcp 4444 (temporary)'), lg('SYSMON', 'EID 3 · Image=C:\\Windows\\Temp\\payload.exe · Initiated=false · SourceIp=203.0.113.50 · SourcePort=51822 · DestinationIp=10.0.0.20 · DestinationPort=4444'), wc('netstat -ano | findstr :4444'), ns('bind-est', ':4444')],
    },
    {
      title: T('Conectar cmd.exe al socket', 'Wire cmd.exe to the socket'),
      what: T('Una conexión TCP no es una shell. El payload lanza <code>cmd.exe</code> y le entrega el socket como <b>entrada estándar, salida estándar y salida de error</b>. cmd.exe no sabe nada de redes: lee de “su teclado” y escribe en “su pantalla”, y esos cables ahora son el socket. Lo que escribes en Kali viaja como bytes hasta stdin; lo que cmd imprime vuelve por el mismo socket. Tu terminal de Kali hace el eco de lo que tecleas.',
        'A TCP connection is not a shell. The payload launches <code>cmd.exe</code> and hands it the socket as <b>standard input, standard output and standard error</b>. cmd.exe knows nothing about networks: it reads from “its keyboard” and writes to “its screen”, and those wires are now the socket. What you type in Kali travels as bytes to stdin; what cmd prints comes back over the same socket. Your Kali terminal does the echo of what you type.'),
      cmd: [{ who: 'ps', text: PIPE_PSEUDO }],
      predict: {
        q: T('¿Qué hace que lo que tecleas en Kali llegue a cmd.exe?', 'What makes what you type in Kali reach cmd.exe?'),
        opts: [T('cmd.exe contiene código de red.', 'cmd.exe contains networking code.'), T('Su entrada estándar está conectada al socket.', 'Its standard input is wired to the socket.'), T('El firewall reenvía las pulsaciones.', 'The firewall forwards the keystrokes.')],
        ok: 1,
        why: T('Es el mismo cmd.exe de siempre. Sólo cambia hacia dónde apuntan sus tres “cables” (stdin, stdout, stderr). Por eso una bind y una reverse shell son idénticas una vez conectadas.', 'It is the same old cmd.exe. Only the targets of its three “wires” (stdin, stdout, stderr) change. That is why a bind and a reverse shell are identical once connected.'),
      },
      def: T('Observa la cadena padre→hijo: w3wp.exe → payload.exe → cmd.exe. Un servidor web casi nunca debería lanzar un intérprete de comandos: es una de las detecciones de mayor fidelidad (Sysmon evento 1, o evento 4688 de Windows con auditoría de línea de comandos).', 'Look at the parent→child chain: w3wp.exe → payload.exe → cmd.exe. A web server should almost never launch a command interpreter: it is one of the highest-fidelity detections (Sysmon event 1, or Windows event 4688 with command-line auditing).'),
      scene: { rows: { C: ROW_CMD }, pipe: true, hl: ['w'] },
      anim: [{ pulse: ['B'] }, { pulse: ['C'] }, { pk: 'w>k', lane: 'shell', label: 'banner' }],
      k: [...BANNER, rp(CWD0 + '>')],
      w: [lg('SYSMON', 'EID 1 · Image=C:\\Windows\\System32\\cmd.exe · ParentImage=C:\\Windows\\Temp\\payload.exe · User=IIS APPPOOL\\DefaultAppPool')],
    },
    {
      title: T('Tu turno: usa la shell', 'Your turn: use the shell'),
      what: T('La shell está viva. Escribe en la terminal de Kali (o pulsa un ejercicio para cargarlo) y observa el panel del defensor: <b>cada comando deja rastro</b>. Fíjate también en qué comandos crean un proceso nuevo (<code>whoami.exe</code>) y cuáles son internos de cmd.exe (<code>cd</code>, <code>dir</code>).',
        'The shell is alive. Type in the Kali terminal (or click an exercise to load it) and watch the defender panel: <b>every command leaves a trace</b>. Notice also which commands create a new process (<code>whoami.exe</code>) and which are internal to cmd.exe (<code>cd</code>, <code>dir</code>).'),
      live: 'shell',
      tasks: LIVE_TASKS_SHELL('bind'),
      scene: { hl: ['k', 'w'] },
      anim: [],
      k: [], w: [],
    },
    {
      title: T('Qué te llevas y cómo se defiende', 'Takeaways and defenses'),
      points: [
        T('<b>Bind = el servidor escucha y el atacante conecta.</b> El primer SYN va de Internet hacia la DMZ.', '<b>Bind = the server listens and the attacker connects.</b> The first SYN goes from the Internet toward the DMZ.'),
        T('Necesita una <b>entrada permitida</b> en el puerto elegido, tanto en el firewall perimetral como en el de Windows. Por eso rara vez funciona a través de Internet.', 'It needs an <b>allowed inbound</b> on the chosen port, in both the perimeter firewall and the Windows one. That is why it rarely works across the Internet.'),
        T('Una shell son tres piezas: un <b>socket</b> TCP, un <b>intérprete</b> (cmd.exe) y la <b>redirección</b> de E/S entre ambos.', 'A shell is three pieces: a TCP <b>socket</b>, an <b>interpreter</b> (cmd.exe) and the <b>I/O redirection</b> between them.'),
        T('Los síntomas dicen dónde falla: <i>timed out</i> = algo descarta paquetes; <i>refused</i> = llegaste al host y nadie escucha.', 'The symptoms tell you where it fails: <i>timed out</i> = something drops packets; <i>refused</i> = you reached the host and nobody listens.'),
      ],
      defList: [
        T('Denegar por defecto el tráfico entrante y publicar sólo lo imprescindible.', 'Deny inbound traffic by default and publish only what is essential.'),
        T('Mantener activo el firewall de host: un proceso que escucha en un puerto nuevo no debe ser alcanzable sin una regla explícita.', 'Keep the host firewall on: a process listening on a new port must not be reachable without an explicit rule.'),
        T('Alertar por puertos nuevos en LISTEN y por hijos inesperados de w3wp.exe.', 'Alert on new LISTEN ports and on unexpected children of w3wp.exe.'),
        T('Segmentar la red: limitar qué orígenes pueden alcanzar qué puertos, también dentro de la LAN.', 'Segment the network: limit which sources can reach which ports, inside the LAN too.'),
      ],
      scene: { hl: [] }, anim: [], k: [], w: [],
    },
  ],
};

/* ------------------------------------------------------------- REVERSE */
STAGES.reverse = {
  name: T('Reverse shell', 'Reverse shell'),
  goal: T('El atacante escucha y es el servidor quien se conecta hacia fuera.', 'The attacker listens and it is the server that connects outward.'),
  steps: [
    {
      title: T('Punto de partida: la misma falla, la lectura correcta del firewall', 'Starting point: same flaw, reading the firewall correctly'),
      what: T('Mismo escenario: el atacante puede ejecutar un programa en el servidor. Mira las reglas del firewall: entrada <b>denegada</b> salvo 80 y 443; salida <b>permitida</b> (política típica: los servidores necesitan actualizarse, resolver DNS y hablar con APIs). Esa asimetría es la que explota una reverse shell.',
        'Same scenario: the attacker can run a program on the server. Look at the firewall rules: inbound <b>denied</b> except 80 and 443; outbound <b>allowed</b> (typical policy: servers need to update, resolve DNS and call APIs). That asymmetry is what a reverse shell exploits.'),
      predict: {
        q: T('Con la entrada denegada y la salida permitida, ¿quién debería “escuchar”?', 'With inbound denied and outbound allowed, who should “listen”?'),

    return () => nodes.forEach(([n, id]) => { if (id === 'K' || id === 'W' || id === 'FW') apply(state); else n.classList.remove('pulse'); });
  }
  async function play(items) {
    const tk = ++token;
    el.pks.innerHTML = ''; el.fx.innerHTML = '';
    for (const it of items) {
      if (tk !== token) return false;
      if (it.pk) await packet(it.pk, it.lane || 'shell', it.label, it.stop, tk);
      else if (it.pulse) { const done = pulse(it.pulse); await sleep(400 / speed); done(); }
      else if (it.wait) await sleep(it.wait / speed);
      else if (it.set) { apply(mergeState(state, it.set)); await sleep(60); }
      if (tk !== token) return false;
    }
    return tk === token;
  }
  build();
  apply(state);
  root.addEventListener('click', (e) => { const g = e.target.closest('[data-pick]'); if (g && opts.onPick) opts.onPick(g.dataset.pick); });
  return {
    set(s) { token++; el.pks.innerHTML = ''; el.fx.innerHTML = ''; apply(s); },
    patch(p) { apply(mergeState(state, p)); },
    get state() { return state; },
    play,
    stop() { token++; el.pks.innerHTML = ''; el.fx.innerHTML = ''; },
    setSpeed(v) { speed = v; },
    refresh() { const keep = state; build(); apply(keep); },
  };
}

function termBox(kind, title, id) {

function makeTerm(root) {
  const body = $('.tb', root);
  const scroll = () => { body.scrollTop = body.scrollHeight; };
  return {
    root, body,
    clear() { body.innerHTML = ''; },
    add(l) { body.insertAdjacentHTML('beforeend', lineHTML(l)); scroll(); },
    set(ls) { body.innerHTML = ls.map(lineHTML).join(''); scroll(); },
    async type(l, alive, speed) {
      const cmd = l.s != null ? l.s : l.c;
      body.insertAdjacentHTML('beforeend', lineHTML(Object.assign({}, l, { s: '', c: '' })));
      const c = body.querySelector('.ln:last-child .c');
      const per = Math.max(8, Math.min(40, 1100 / Math.max(1, cmd.length))) / speed;
      for (let n = 1; n <= cmd.length; n++) { if (!alive()) return false; c.textContent = cmd.slice(0, n); scroll(); await sleep(REDUCED ? 0 : per); }
      return true;
    },
    form(promptHTML, onSubmit) {
      let f = $('form', root);
      if (f) f.remove();
      f = document.createElement('form');
      f.autocomplete = 'off';
      f.innerHTML = '<span class="pl">' + promptHTML + '</span><input type="text" spellcheck="false" autocapitalize="off" aria-label="' + esc(t('Comando', 'Command')) + '">';
      root.appendChild(f);
      const inp = $('input', f), hist = []; let hp = 0;
      f.addEventListener('submit', (e) => { e.preventDefault(); const v = inp.value; inp.value = ''; if (v.trim()) { hist.push(v); hp = hist.length; } onSubmit(v); });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' && hist.length) { hp = Math.max(0, hp - 1); inp.value = hist[hp]; e.preventDefault(); }
        if (e.key === 'ArrowDown') { hp = Math.min(hist.length, hp + 1); inp.value = hist[hp] || ''; e.preventDefault(); }
        e.stopPropagation();
      });
      return { input: inp, form: f, prompt: $('.pl', f) };
    },
    noForm() { const f = $('form', root); if (f) f.remove(); },
  };
}

  async function reveal(i, tk) {

      else if (chk) { fp++; row.classList.add('fp'); res = '⚠ ' + t('Falso positivo', 'False positive'); }

}

    if (cfg.shell === 'reverse') h += '<div class="fieldset"><span class="lg">' + esc(t('Reverse shell', 'Reverse shell')) + '</span>' + sel('lport', t('Puerto del listener (LPORT)', 'Listener port (LPORT)'), t('Puerto al que llama el payload.', 'Port the payload calls.'), [['4444', '4444'], ['443', '443']]) + tog('listener', t('Listener activo en Kali', 'Listener running on Kali'), t('nc -lvnp <puerto>', 'nc -lvnp <port>')) + tog('payload', t('Payload ejecutándose', 'Payload running'), t('Requiere ejecución de código previa.', 'Requires prior code execution.')) + '</div>';
    if (cfg.shell === 'web') h += '<div class="fieldset"><span class="lg">' + esc(t('Web shell', 'Web shell')) + '</span>' + sel('upload', t('Validación de la subida', 'Upload validation'), t('Qué comprueba la aplicación.', 'What the application checks.'), [['none', t('sólo el tipo declarado', 'declared type only')], ['allow', t('lista de extensiones + contenido', 'extension allow-list + content')]]) + sel('exec', t('Scripts en /uploads', 'Scripts in /uploads'), t('Mapeo de manejadores de IIS en esa carpeta.', 'IIS handler mapping in that folder.'), [['on', t('se ejecutan', 'execute')], ['off', t('no se ejecutan', 'do not execute')]]) + '</div>';
    h += '<div><h4>' + esc(t('¿Se establecerá la shell?', 'Will the shell be established?')) + '</h4><div class="mini" style="margin-top:6px"><button class="btn kali" data-g="yes">' + esc(t('Creo que sí', 'I think yes')) + '</button><button class="btn" data-g="no">' + esc(t('Creo que no', 'I think no')) + '</button></div><p class="fine" style="margin-top:6px">' + esc(t('Tu predicción: ', 'Your tally: ')) + tally.ok + '/' + tally.n + '</p></div>';
    h += '<div><h4>' + esc(t('Escenarios para probar', 'Scenarios to try')) + '</h4><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">' + PRESETS.map((p, i) => '<button class="btn small" style="text-align:left;justify-content:flex-start" data-p="' + i + '">' + L(p[0]) + '</button>').join('') + '</div></div>';

    $$('[data-sh]', host).forEach((b) => b.addEventListener('click', () => { cfg.shell = b.dataset.sh; busy++; res = null; draw(); }));
    $$('select', $('#ctl', host)).forEach((s) => s.addEventListener('change', () => { const k = s.id.slice(4); cfg[k] = (k === 'port' || k === 'lport') ? Number(s.value) : s.value; busy++; res = null; clearMarks(); preview(); result(); }));
    $$('input[type=checkbox]', $('#ctl', host)).forEach((s) => s.addEventListener('change', () => { cfg[s.id.slice(4)] = s.checked; busy++; res = null; clearMarks(); preview(); result(); }));
    $$('[data-g]', host).forEach((b) => b.addEventListener('click', () => run(b.dataset.g)));
    $$('[data-p]', host).forEach((b) => b.addEventListener('click', () => { cfg = Object.assign({}, LAB_DEFAULT, PRESETS[+b.dataset.p][1]); busy++; res = null; draw(); }));
  }
  const clearMarks = () => $$('.fld', host).forEach((f) => f.classList.remove('used', 'unused'));
  function mark() { $$('.fld', host).forEach((f) => { const u = res.used.includes(f.dataset.f); f.classList.toggle('used', u); f.classList.toggle('unused', !u); }); }
  function result() {
    const r = $('#result', host);
    if (!res) { r.innerHTML = '<h4>' + esc(t('Resultado', 'Outcome')) + '</h4><p class="fine" style="margin-top:6px">' + esc(t('Haz tu predicción para ejecutar el intento.', 'Make your prediction to run the attempt.')) + '</p>'; return; }
    const correct = guess === (res.ok ? 'yes' : 'no');

      '<div class="callout ' + (res.ok ? 'warn' : 'ok') + '" style="margin-top:10px">' + L(res.tip) + '</div><p class="fine" style="margin-top:8px">' + esc(t('Los ajustes con barra verde participaron en el resultado; los atenuados no influyeron.', 'Settings with a green bar took part in the outcome; dimmed ones made no difference.')) + '</p>';
  }
  async function run(g) {
    const id = ++busy;
    if (window.innerWidth <= 960) { try { $('#labsc', host).scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* ignore */ } }
    guess = g; res = labRun(cfg);
    tally.n++; if (g === (res.ok ? 'yes' : 'no')) tally.ok++;
    const sc = labScenario(cfg, res), pre = mergeState(BASE_STATE(), sc.pre);
    scene.set(pre); setRules(pre);

    await scene.play(sc.anim);
    if (id !== busy || !res) return;
    const fin = mergeState(pre, sc.post); scene.set(fin); setRules(fin);
    controls(); mark(); result();
  }
  function draw() { controls(); preview(); result(); }
  draw();
}

/* ============ App shell: tabs, language, view switching ============ */
const TABS = [['intro', T('Inicio', 'Start')], ['bind', T('Bind', 'Bind')], ['reverse', T('Reverse', 'Reverse')], ['web', T('Web', 'Web')], ['lab', T('Laboratorio', 'Lab')], ['compare', T('Comparar', 'Compare')], ['glossary', T('Glosario', 'Glossary')]];
let current = 'intro', cleanup = null;

function chrome() {
  document.documentElement.lang = lang;
  $('#nav').innerHTML = TABS.map(([k, n]) => '<button class="tab" role="tab" data-k="' + k + '" aria-selected="' + (k === current) + '">' + esc(L(n)) + '</button>').join('');
  $('#tag').textContent = t('Cómo funcionan las bind, reverse y web shells', 'How bind, reverse and web shells work');
  $('#langBtn').textContent = lang === 'es' ? 'EN' : 'ES';
  $('#langBtn').setAttribute('aria-label', lang === 'es' ? 'Switch to English' : 'Cambiar a español');
  $('#foot').textContent = t('Material educativo para el curso de Ciberdefensa Avanzada. Simulación sin conexiones reales; empresa, hosts y direcciones ficticios. Practica sólo en entornos autorizados.', 'Educational material for the Advanced Cyberdefense course. A simulation with no real connections; company, hosts and addresses are fictional. Practice only in authorized environments.');
}
function show(k) {
  if (cleanup) { cleanup(); cleanup = null; }
  current = k;
  $$('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.k === k));
  const main = $('#main'); main.innerHTML = '<div id="v"></div>';
  const host = $('#v');
  if (STAGES[k]) { const m = mountStage(k, host); cleanup = m.destroy; }
  else if (k === 'intro') viewIntro(host);
  else if (k === 'lab') mountLab(host);
  else if (k === 'compare') viewCompare(host);
  else viewGlossary(host);
}
function initLang() {
  let saved = null;
  try { saved = localStorage.getItem('shells-lang'); } catch (e) { /* storage unavailable */ }
  lang = saved === 'en' || saved === 'es' ? saved : ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
}
function boot() {
  initLang();
  const h = (location.hash || '').slice(1);
  if (TABS.some(([k]) => k === h)) current = h;
  chrome();
  $('#nav').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) { show(b.dataset.k); window.scrollTo(0, 0); } });
  $('#langBtn').addEventListener('click', () => {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('shells-lang', lang); } catch (e) { /* ignore */ }
    chrome(); show(current);
  });
  show(current);
}
boot();
