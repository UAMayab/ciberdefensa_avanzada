# Miniworkshop Nmap — vhosts de nmap-target (80/tcp y 443/tcp).
# Cada desconfiguración de aquí existe para que un script NSE concreto tenga
# algo que encontrar en el Episodio 3. Ninguna es aceptable en producción.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/lab;
    index index.html;

    # Delata nginx y su versión exacta en cada respuesta.
    # (http-server-header, http-headers)
    server_tokens on;

    # Listado automático de directorios: lo que hace que /uploads/ y /.git/
    # sean navegables sin adivinar nombres. (http-enum)
    location /uploads/ { autoindex on; }
    location /respaldos/ { autoindex on; }

    # nginx bloquea por defecto los ficheros ocultos en algunas plantillas;
    # aquí se permiten a propósito para que .git/ y .env sean accesibles.
    # (http-git, y el script propio http-env-leak.nse del Episodio 3)
    location ~ /\.git { autoindex on; allow all; }
    location = /.env  { allow all; default_type text/plain; }

    # Área "protegida" con credenciales de fábrica. (http-default-accounts,
    # http-brute)
    location /admin/ {
        auth_basic           "Panel de administracion";
        auth_basic_user_file /etc/nginx/lab.htpasswd;
    }

    # El servidor ANUNCIA métodos de escritura en la respuesta a OPTIONS.
    # No los implementa, pero eso da igual: lo que un escáner —y un atacante—
    # leen es el anuncio. (http-methods)
    # `add_header` sólo se admite dentro de location, no en el server.
    location / {
        if ($request_method = OPTIONS) {
            add_header Allow "GET, HEAD, POST, PUT, DELETE, OPTIONS, TRACE, PATCH";
            add_header Content-Length 0;
            return 204;
        }
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    root /var/www/lab;
    index index.html;
    server_tokens on;

    ssl_certificate     /etc/nginx/tls/lab-weak.crt;   # RSA-1024, SHA-1, caducado
    ssl_certificate_key /etc/nginx/tls/lab-weak.key;
    ssl_dhparam         /etc/nginx/tls/dh1024.pem;     # grupo DH de 1024 bits

    # Protocolos obsoletos: TLS 1.0 (1999) y 1.1 (2006), retirados por el IETF
    # en la RFC 8996 (2021). ssl-enum-ciphers los califica con una F.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # @SECLEVEL=0 desactiva el mínimo criptográfico de OpenSSL 3, sin lo cual
    # este certificado ni siquiera cargaría. Se piden explícitamente suites
    # con 3DES, CBC y DHE para que haya qué reportar.
    ssl_ciphers 'ALL:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;
}
