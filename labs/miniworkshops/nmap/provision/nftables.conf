#!/usr/sbin/nft -f
# Miniworkshop Nmap — cortafuegos de nmap-target.
# No está aquí para proteger nada: está para que el laboratorio produzca a
# propósito los cuatro estados de puerto que Nmap sabe distinguir, y que
# `--reason` tenga algo que explicar (Episodios 1 y 2).
#
#   open     -> los siete servicios, que aceptan la conexión
#   filtered -> 8080/tcp DROP        (sin respuesta   -> reason: no-response)
#   filtered -> 445/tcp  REJECT ICMP (tipo 3 código 13 -> reason: admin-prohibited)
#   closed   -> todo lo demás, que el kernel responde con RST

flush ruleset

table inet lab {
    chain input {
        type filter hook input priority filter; policy accept;

        # 8080: silencio absoluto. Nmap no puede distinguir «hay un
        # cortafuegos» de «el paquete se perdió», y por eso reintenta.
        tcp dport 8080 drop

        # 445: el cortafuegos contesta y se delata. Nmap lo marca igual como
        # filtered, pero --reason revela quién lo dijo y cómo.
        tcp dport 445 reject with icmpx type admin-prohibited
    }
}
