# Miniworkshop Nmap — configuración adicional de sshd en nmap-target.
# Reactiva a propósito algoritmos heredados que OpenSSH 9.6 trae compilados
# pero desactivados por defecto, para que `ssh2-enum-algos` (Episodio 3) tenga
# algo real que reportar. El «+» los AÑADE a la lista por defecto.
#
# ATENCIÓN: esto es exactamente lo que no se debe hacer en producción.

PasswordAuthentication yes
PermitRootLogin no

KexAlgorithms +diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
Ciphers +3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc
MACs +hmac-sha1,hmac-sha1-96,hmac-md5,hmac-md5-96
HostKeyAlgorithms +ssh-rsa
PubkeyAcceptedAlgorithms +ssh-rsa
