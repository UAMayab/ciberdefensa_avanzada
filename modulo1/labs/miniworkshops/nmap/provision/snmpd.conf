# Miniworkshop Nmap — SNMP de nmap-target (161/udp).
# Único servicio UDP del laboratorio: sin él no se puede enseñar `-sU`.
# Community de solo lectura «public», la que trae de fábrica media industria.

rocommunity public default

# Estos tres campos son los que `snmp-info` y `snmp-sysdescr` van a volcar.
# Están deliberadamente llenos de información que una organización real no
# debería publicar: quién administra, dónde está la máquina y qué corre.
sysLocation    Rack B-12, CPD Merida, planta baja (acceso por tarjeta 0042)
sysContact     Soporte TI <ti@auroramaritima.example> ext. 4417
sysName        nmap-target.lab
sysServices    72

# Sin esta línea net-snmp sólo expone la rama system y el ejercicio de
# `snmp-interfaces` / `snmp-netstat` se queda corto.
view   all          included   .1
rocommunity public default -V all

agentAddress udp:161
