# Miniworkshop Bettercap — nginx de srv.
# Cenote Logística es una empresa FICTICIA; nada de aquí es real.
#
# Registro de acceso con el Host y los bytes servidos: en los episodios 2 y 3
# es la evidencia "del lado del servidor" que se contrasta con lo que vio el
# cliente.
log_format lab '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_host" "$http_user_agent"';
access_log /var/log/nginx/access.log lab;

# --- intranet.corp.lab: HTTP y HTTPS conviven; HTTP NO redirige (heredado) ---
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name intranet.corp.lab;
    ssl_certificate     /etc/nginx/tls/srv.crt;
    ssl_certificate_key /etc/nginx/tls/srv.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/intranet;
    index index.html;

    location = /login {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
    location /admin/ {
        auth_basic "Soporte TI";
        auth_basic_user_file /etc/nginx/lab.htpasswd;
    }
}

# --- pagos.corp.lab: HTTP sólo existe para redirigir a HTTPS; HTTPS lleva HSTS ---
server {
    listen 80;
    server_name pagos.corp.lab;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pagos.corp.lab;
    ssl_certificate     /etc/nginx/tls/srv.crt;
    ssl_certificate_key /etc/nginx/tls/srv.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /var/www/pagos;
    index index.html;

    location = /login {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
