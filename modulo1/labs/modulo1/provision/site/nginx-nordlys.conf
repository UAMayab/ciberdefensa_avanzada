# Nordlys AI ApS — sitio web ficticio del laboratorio (Modulo I, Anexo A).
# Objetivo de la actividad de reconocimiento: cada desviacion respecto a una
# configuracion endurecida es deliberada. Ver "Banderas" en README.md.

# --- Sitio de produccion (default_server: responde por IP) -------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name nordlysai.dk www.nordlysai.dk _;
    root /var/www/nordlys;
    index index.html;

    # Fingerprinting: se expone la version de nginx a proposito (server_tokens
    # on es el valor por defecto; se deja explicito para que se vea la intencion).
    server_tokens on;

    # Cabecera de build filtrada por error — bandera 6.
    add_header X-Nordlys-Build "web-public/3.4.1 (build=FLAG{nordlys_http_header_8b17}; env=production)" always;
    add_header X-Powered-By "nordlys-docgen/2.1.0" always;

    charset utf-8;
    access_log /var/log/nginx/nordlys-access.log;
    error_log  /var/log/nginx/nordlys-error.log warn;

    # Listado de directorio olvidado tras una depuracion — bandera 10.
    location /uploads/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # La API real no esta desplegada; responde como un endpoint protegido.
    location /api/ {
        default_type application/json;
        return 403 '{"error":"forbidden","detail":"public API requires an API key","docs":"https://api.nordlysai.dk/v2/docs"}';
    }

    # Pagina de error propia — bandera 14.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # NOTA: no se incluye "location ~ /\. { deny all; }" a proposito, para que
    # /.env, /.git/config y /.well-known/security.txt sean accesibles.
}

# --- Entorno de staging (solo responde con Host: dev.nordlysai.dk) ----------
server {
    listen 80;
    listen [::]:80;

    server_name dev.nordlysai.dk;
    root /var/www/nordlys-staging;
    index index.html;

    server_tokens on;
    add_header X-Nordlys-Build "web-public/3.5.0-rc2 (env=staging)" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    charset utf-8;
    access_log /var/log/nginx/nordlys-staging-access.log;
    error_log  /var/log/nginx/nordlys-staging-error.log warn;

    # El staging comparte los estaticos del sitio de produccion.
    location /assets/ {
        root /var/www/nordlys;
    }
}
