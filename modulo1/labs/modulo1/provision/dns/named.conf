// named.conf — laboratorio Módulo I (Anexo A), VM ns-nordlys
//
// Doble papel:
//   1. Autoritativo para nordlysai.dk y para su zona inversa.
//   2. Resolver recursivo para las redes del laboratorio, de forma que Kali
//      pueda apuntar aquí su único resolver sin perder salida a Internet.
//
// CONFIGURACIÓN DELIBERADAMENTE DÉBIL — igual que el resto del laboratorio:
// 'allow-transfer { any; }' deja que cualquiera vuelque la zona completa
// (AXFR). Es la mala configuración que la Actividad A.2 enseña a detectar.
// NO copiar a producción: en un servidor real la transferencia se restringe
// a los secundarios legítimos y nada más.

options {
    directory "/var/bind";
    pid-file  "/var/run/named/named.pid";

    listen-on    { any; };
    listen-on-v6 { none; };

    allow-query { any; };

    // Recursión limitada a los segmentos del laboratorio.
    allow-recursion {
        127.0.0.1;
        192.168.56.0/24;
        192.168.57.0/24;
        192.168.58.0/24;
    };
    forwarders { 8.8.8.8; 1.1.1.1; };
    forward first;

    // El laboratorio está aislado y las zonas son ficticias.
    dnssec-validation no;

    allow-transfer { any; };   // <-- deliberado, ver cabecera
};

zone "nordlysai.dk" IN {
    type master;
    file "pri/db.nordlysai.dk";
};

zone "56.168.192.in-addr.arpa" IN {
    type master;
    file "pri/db.192.168.56";
};
