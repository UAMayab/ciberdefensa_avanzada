# Entregable final — Módulo I · nginx del sitio corporativo ficticio de Delphos.
# /backups/ con autoindex activo simula un directorio de respaldos expuesto.
server {
    listen 80;
    server_name delphos-seguros.mx _;
    root /usr/share/nginx/html;
    index index.html;

    location /backups/ {
        autoindex on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
